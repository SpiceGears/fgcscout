services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    image: fgcscout-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    working_dir: /src
    command:
      - dotnet
      - watch
      - run
      - --no-launch-profile
      - --project
      - backend.csproj
      - --
      - --urls
      - http://0.0.0.0:80
    ports:
      - "5000:80"
    depends_on:
      - mongodb
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      DatabaseSettings__ConnectionString: mongodb://mongodb:27017
      DatabaseSettings__DatabaseName: fgcscout
      AdminSettings__ApiKey: ${FGCSCOUT_ADMIN_API_KEY:-}
      # Development origins are fixed so a production value in .env cannot break local CORS.
      Cors__AllowedOrigins__0: http://localhost:3000
      Cors__AllowedOrigins__1: http://127.0.0.1:3000
      SeasonSync__AllowedHosts__0: results.first.global
    volumes:
      - type: bind
        source: ./backend
        target: /src
      - backend_bin:/src/bin
      - backend_obj:/src/obj

  frontend:
    image: fgcscout-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    working_dir: /app
    command:
      - npm
      - run
      - dev
      - --
      - --hostname
      - 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - type: bind
        source: ./frontend
        target: /app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next-fgcscout

volumes:
  mongo_data:
    name: fgcscout_mongo_data
  backend_bin:
  backend_obj:
  frontend_node_modules:
  frontend_next_cache:
