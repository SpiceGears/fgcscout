x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-fgcscout_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_APP_DATABASE:-fgcscout}
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE:-fgcscout}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-fgcscout_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/10-create-app-user.js:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host localhost --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: fgcscout-backend-prod
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      DatabaseSettings__ConnectionString: mongodb://mongodb:27017
      DatabaseSettings__DatabaseName: ${MONGO_APP_DATABASE:-fgcscout}
      DatabaseSettings__Username: ${MONGO_APP_USERNAME:-fgcscout_app}
      DatabaseSettings__Password: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
      DatabaseSettings__AuthenticationSource: ${MONGO_APP_DATABASE:-fgcscout}
      AdminSettings__ApiKey: ${FGCSCOUT_ADMIN_API_KEY:?Set FGCSCOUT_ADMIN_API_KEY in .env}
      Cors__AllowedOrigins__0: ${FGCSCOUT_FRONTEND_ORIGIN:-http://localhost}
      SeasonSync__AllowedHosts__0: results.first.global
      HttpsRedirection__Enabled: "false"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: fgcscout-frontend-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_SITE_OPERATOR: ${NEXT_PUBLIC_SITE_OPERATOR:-FGC Scout project operator}
        NEXT_PUBLIC_PRIVACY_CONTACT: ${NEXT_PUBLIC_PRIVACY_CONTACT:-}
        NEXT_PUBLIC_OPERATOR_ADDRESS: ${NEXT_PUBLIC_OPERATOR_ADDRESS:-}
        NEXT_PUBLIC_HOSTING_PROVIDER: ${NEXT_PUBLIC_HOSTING_PROVIDER:-}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mongo_data:
    name: fgcscout_prod_mongo_data
  caddy_data:
  caddy_config:
