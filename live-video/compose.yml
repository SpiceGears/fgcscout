services:
  live-video:
    build: .
    restart: unless-stopped
    environment:
      FGCSCOUT_ADMIN_API_KEY: ${FGCSCOUT_ADMIN_API_KEY:?Set FGCSCOUT_ADMIN_API_KEY}
    volumes:
      - ./config.json:/app/config.json:ro
      - live-video-state:/app/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  live-video-state:
